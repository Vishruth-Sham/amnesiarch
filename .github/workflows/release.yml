name: Release Obsidian plugin

on:
  push:
    # Keep the tag filter broad (any tag triggers the workflow); the validation step below is
    # what rejects a non-SemVer, mismatched, or "v"-prefixed tag loudly, rather than the trigger
    # silently ignoring it. Obsidian's installer requires the bare version with no "v" prefix
    # (e.g. "0.1.0", not "v0.1.0") -- see the tag-prefix check below.
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The repository's Node typings target Node 20 and no engine is declared.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate release metadata and assets
        id: metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
          const tagName = process.env.GITHUB_REF_NAME;
          const semver = /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;

          // Obsidian's plugin installer rejects a "v"-prefixed release tag outright ("Your GitHub
          // release doesn't use a v in front of the version number, it should be 1.0.0 not
          // v1.0.0") -- it wants the exact opposite of what that message literally says: no "v"
          // at all. A previous version of this check silently stripped a leading "v" before
          // comparing versions, which is exactly how a "v0.1.0" release got published and
          // rejected by Obsidian. Never strip it -- fail loudly instead so a mistagged release
          // never reaches the "Create GitHub Release" step.
          if (tagName.startsWith("v")) {
            throw new Error(
              `Release tag "${tagName}" starts with "v", but Obsidian's plugin installer requires ` +
                `the bare version number with no "v" prefix (e.g. "0.1.0", not "v0.1.0"). Delete ` +
                `this tag and push a new one without the leading "v".`,
            );
          }
          const tagVersion = tagName;

          if (!semver.test(tagVersion)) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} is not a supported SemVer tag`);
          }
          if (manifest.version !== tagVersion) {
            throw new Error(
              `Release tag ${process.env.GITHUB_REF_NAME} does not match manifest.json version ${manifest.version}`,
            );
          }
          if (!/^[a-z0-9-]+$/.test(manifest.id)) {
            throw new Error(`manifest.json contains an unsafe plugin id: ${manifest.id}`);
          }
          // Maintainers must add this compatibility decision before tagging.
          // CI validates versions.json but intentionally never edits it.
          if (!Object.hasOwn(versions, manifest.version)) {
            throw new Error(
              `versions.json is missing ${manifest.version}; add its minimum Obsidian version manually before tagging`,
            );
          }

          for (const asset of ["main.js", "manifest.json", "styles.css"]) {
            const stat = fs.statSync(asset);
            if (!stat.isFile() || stat.size === 0) {
              throw new Error(`Required release asset is missing or empty: ${asset}`);
            }
          }
          NODE

          plugin_id="$(node -p 'require("./manifest.json").id')"
          version="$(node -p 'require("./manifest.json").version')"
          echo "plugin_id=${plugin_id}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create convenience archive
        id: archive
        shell: bash
        run: |
          plugin_id="${{ steps.metadata.outputs.plugin_id }}"
          version="${{ steps.metadata.outputs.version }}"
          mkdir -p "release/${plugin_id}"
          cp main.js manifest.json styles.css "release/${plugin_id}/"
          (cd release && zip -r "../${plugin_id}-${version}.zip" "${plugin_id}")
          echo "path=${plugin_id}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js \
            manifest.json \
            styles.css \
            "${{ steps.archive.outputs.path }}" \
            --verify-tag \
            --generate-notes \
            --title "${{ steps.metadata.outputs.plugin_id }} ${{ steps.metadata.outputs.version }}"
