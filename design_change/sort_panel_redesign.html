<div style="background:var(--surface-1); border-radius:12px; padding:1.25rem; max-width:560px;">
  <p style="font-size:13px; color:var(--text-secondary); margin:0 0 12px;">A few notes could match</p>

  <div style="display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border-accent); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;">
    <span style="font-size:14px; font-weight:500; flex:1;">Item Rec Eval</span>
    <div style="width:60px; height:5px; background:var(--border); border-radius:3px; overflow:hidden;">
      <div style="width:80%; height:100%; background:var(--text-accent);"></div>
    </div>
    <span style="font-size:11px; color:var(--text-muted);">best match</span>
  </div>

  <div style="display:flex; align-items:center; gap:10px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;">
    <span style="font-size:14px; flex:1;">Product Recommendation</span>
    <div style="width:60px; height:5px; background:var(--border); border-radius:3px; overflow:hidden;">
      <div style="width:60%; height:100%; background:var(--text-muted);"></div>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:10px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:16px;">
    <span style="font-size:14px; flex:1;">question-recommendation-deep-dive</span>
    <div style="width:60px; height:5px; background:var(--border); border-radius:3px; overflow:hidden;">
      <div style="width:35%; height:100%; background:var(--text-muted);"></div>
    </div>
  </div>

  <div style="display:flex; gap:8px; border-top:0.5px solid var(--border); padding-top:12px;">
    <button style="font-weight:500;">Use "Item Rec Eval"</button>
    <button>Create new note</button>
    <button>Search instead</button>
    <button style="margin-left:auto;">Keep editing</button>
  </div>
</div>
